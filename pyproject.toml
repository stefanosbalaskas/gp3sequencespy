[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gp3sequencespy"
version = "0.1.0a1"
description = "Transparent, reproducible, and auditable analysis of ordered categorical sequences in Python."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Stefanos Balaskas"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.12", "mypy>=1.15", "build>=1.2"]
hmm = ["hmmlearn>=0.3.3"]
data = ["polars>=1", "pyarrow>=17"]
performance = ["numba>=0.61"]
time = ["patsy>=1.0.1", "statsmodels>=0.15.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6", "mkdocstrings[python]>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/gp3sequencespy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
