[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gp3sequencespy"
version = "0.1.1"
description = "Transparent, reproducible, and auditable analysis of ordered categorical sequences in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Stefanos Balaskas"}]
maintainers = [{name = "Stefanos Balaskas"}]
keywords = ["sequence-analysis", "scanpaths", "eye-tracking", "categorical-sequences", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.urls]
Homepage = "https://stefanosbalaskas.github.io/gp3sequencespy/"
Documentation = "https://stefanosbalaskas.github.io/gp3sequencespy/"
Source = "https://github.com/stefanosbalaskas/gp3sequencespy"
Issues = "https://github.com/stefanosbalaskas/gp3sequencespy/issues"
Changelog = "https://github.com/stefanosbalaskas/gp3sequencespy/blob/main/CHANGELOG.md"
Archive = "https://doi.org/10.5281/zenodo.22166449"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.12", "mypy>=1.15", "build>=1.2"]
hmm = ["hmmlearn>=0.3.3"]
data = ["polars>=1", "pyarrow>=17"]
performance = ["numba>=0.61"]
time = ["mssm>=1.2.5,<1.3"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6", "mkdocstrings[python]>=0.29"]
release = ["twine>=6", "validate-pyproject>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/gp3sequencespy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
