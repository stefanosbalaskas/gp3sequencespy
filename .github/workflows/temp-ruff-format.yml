name: Temporary Ruff Format

on:
  push:
    branches:
      - quality/coverage-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v7.0.1
        with:
          ref: quality/coverage-completion
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync formatter environment
        run: uv sync --extra dev --extra time

      - name: Apply canonical Ruff formatting
        run: uv run ruff format src tests parity

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Ruff found no formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests parity
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:quality/coverage-completion
