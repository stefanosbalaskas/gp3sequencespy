name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync environment
        run: uv sync --extra dev --extra time
      - name: Run tests
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build distributions
        run: uv build
      - name: Fresh wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/gp3seq-wheel-test
          /tmp/gp3seq-wheel-test/bin/pip install dist/*.whl
          /tmp/gp3seq-wheel-test/bin/python -c "import gp3sequencespy; print(gp3sequencespy.__version__)"
