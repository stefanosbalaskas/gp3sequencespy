name: Temporary release preparation

on:
  push:
    branches:
      - release/0.1.2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/0.1.2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Update release-facing files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("src/gp3sequencespy/__init__.py", '__version__ = "0.1.1"', '__version__ = "0.1.2"')
          replace("CITATION.cff", "version: 0.1.1\ndate-released: 2026-08-30", "version: 0.1.2\ndate-released: 2026-08-31")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\nNo changes yet.\n"
          section = """## [Unreleased]\n\nNo changes yet.\n\n## [0.1.2] - 2026-08-31\n\n### Added\n\n- Complete quality-completion test tranche covering every reachable statement and branch.\n- Mutation-smoke companion oracles for pseudocount normalization, empty subsequences, and distance-diagonal validation.\n- Dedicated coverage ledger and quality-snapshot workflows, plus expanded user-facing documentation, examples, method maps, plot guidance, reporting guidance, and reproducibility material.\n- Guarded release orchestration and post-PyPI verification workflows for exact-artifact stable releases.\n\n### Changed\n\n- Hardened sequence preparation for PyArrow/pandas-backed cumulative operations.\n- Made grouped plotting paths robust to missing grouping values while preserving the frozen plotting contracts.\n- Removed unreachable defensive branches identified during full branch-coverage review.\n- Canonically formatted the quality-completion test suite with Ruff.\n\n### Validation\n\n- **292 / 292** Python tests pass.\n- **4,564 / 4,564** executable statements covered (**100.00%**).\n- **1,702 / 1,702** branches covered (**100.00%**).\n- Mutation smoke: **3 / 3** mutants killed (**100%**).\n- Linux, macOS, and Windows CI passes across Python 3.11–3.14.\n- Ruff lint/format, mypy, frozen API, frozen R-block ledger, frozen signature parity, strict MkDocs, wheel build, and fresh-wheel smoke all pass.\n\n### Scientific/API status\n\n- No breaking public scientific API or signature changes.\n- Frozen R 0.3.0 reference remains unchanged.\n- Frozen API remains **81 / 81**.\n- Frozen R test-block ledger remains **130 / 130**.\n- Frozen public signatures remain **81 / 81** with **0 unexplained drift**.\n"""
          if marker not in text:
              raise SystemExit("CHANGELOG Unreleased marker not found")
          changelog.write_text(text.replace(marker, section, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("## Version 0.1.1 status", "## Version 0.1.2 status")
          text = text.replace("The current Python suite contains **182 tests**", "The current Python suite contains **292 tests**")
          text = text.replace(
              "Version **0.1.1** is a metadata and release-infrastructure maintenance release over the frozen 0.1.0 scientific implementation. It does **not** change the 81-function public scientific API or the frozen R 0.3.0 parity contracts. It corrects the PyPI-facing release wording, records the Zenodo archive DOI, and uses token-free PyPI Trusted Publishing.",
              "Version **0.1.2** is a quality-completion and robustness maintenance release. It preserves the frozen 81-function scientific API and R 0.3.0 parity contracts while raising the Python validation suite to 292 tests, 100% statement and branch coverage, and a 3/3 mutation-smoke gate. It also expands the documentation and hardens PyArrow/pandas preparation and grouped plotting edge cases."
          )
          text = text.replace("pip install gp3sequencespy==0.1.1", "pip install gp3sequencespy==0.1.2")
          readme.write_text(text, encoding="utf-8")

          index = Path("docs/index.md")
          text = index.read_text(encoding="utf-8")
          text = text.replace("gp3sequencespy 0.1.1 · stable PyPI release", "gp3sequencespy 0.1.2 · stable PyPI release")
          text = text.replace("<div><strong>182</strong><span>Python validation tests</span></div>", "<div><strong>292</strong><span>Python validation tests</span></div>")
          text = text.replace(
              "Version **0.1.1** is available from PyPI and preserves the\nvalidated 0.1.0 scientific implementation while adding release and citation\nmetadata.",
              "Version **0.1.2** is available from PyPI and preserves the\nfrozen scientific/API contracts while adding complete statement/branch coverage,\nmutation-smoke protection, robustness repairs, and expanded documentation."
          )
          text = text.replace("pip install gp3sequencespy==0.1.1", "pip install gp3sequencespy==0.1.2")
          text = text.replace(
              "Version **0.1.1** is published through GitHub Releases and PyPI. The scientific\nimplementation remains the frozen 0.1.0 implementation: **81 / 81** public R\ncounterparts, **81 / 81** audited signatures, **130 / 130** translated frozen R\ntest blocks, and **182** Python tests.",
              "Version **0.1.2** is published through GitHub Releases and PyPI. The frozen\nscientific/API contracts remain **81 / 81** public R counterparts, **81 / 81**\naudited signatures, and **130 / 130** translated frozen R test blocks; the Python\nquality suite now contains **292** tests with 100% statement and branch coverage."
          )
          index.write_text(text, encoding="utf-8")

          Path("docs/release-readiness.md").write_text("""# Release status\n\n## gp3sequencespy 0.1.2\n\nVersion **0.1.2** is the current stable release candidate and a quality-completion / robustness maintenance release over the frozen scientific contracts.\n\n<div class=\"gp3-release-panel\">\n<span class=\"gp3-status gp3-status--good\">292 tests</span>\n<span class=\"gp3-status gp3-status--good\">100% statements</span>\n<span class=\"gp3-status gp3-status--good\">100% branches</span>\n<span class=\"gp3-status gp3-status--good\">3/3 mutation smoke</span>\n</div>\n\n## Scientific contract\n\nThe release preserves the frozen R 0.3.0 behavioral reference and does not introduce a breaking public scientific API or signature change.\n\n- frozen API: **81 / 81**\n- frozen signatures: **81 / 81**\n- translated R test blocks: **130 / 130**\n- unexplained signature drift: **0**\n- Python tests: **292**\n- statement coverage: **100.00%**\n- branch coverage: **100.00%**\n- mutation smoke: **3 / 3 killed**\n- deterministic R-oracle tranches: **PASS**\n- strict MkDocs build: **PASS**\n- fresh-wheel smoke: **PASS**\n\n## Quality-completion changes\n\nVersion 0.1.2 adds complete behavioral coverage, mutation-smoke companion oracles, PyArrow/pandas robustness for cumulative preparation operations, NA-safe grouped plotting behavior, dead-branch cleanup, and expanded documentation.\n\n## Publication model\n\nStable releases are built and validated before an annotated `vX.Y.Z` tag and GitHub Release are created. The exact GitHub Release wheel and source distribution are then published to PyPI through the registered Trusted Publisher; no package rebuild occurs in the publishing job.\n\n## Archive\n\nZenodo DOI: [10.5281/zenodo.22166449](https://doi.org/10.5281/zenodo.22166449)\n\n## Historical releases\n\nThe `v0.1.0` and `v0.1.1` tags and their published artifacts remain immutable.\n""", encoding="utf-8")

          checklist = Path("RELEASE_CHECKLIST.md")
          text = checklist.read_text(encoding="utf-8")
          text = text.replace("- [ ] Publish `v0.1.1` only after exact source, artifact, CI, Docs, and Release-check gates pass.", "- [x] Publish `v0.1.1` only after exact source, artifact, CI, Docs, and Release-check gates pass.")
          text = text.replace("- [ ] Confirm the first Trusted Publishing/OIDC upload succeeds with exact GitHub Release artifacts.", "- [x] Confirm the first Trusted Publishing/OIDC upload succeeds with exact GitHub Release artifacts.")
          future = "### Future releases\n"
          section = """### 0.1.2 quality-completion release\n\n- [x] Preserve frozen R 0.3.0 behavioral reference and 81 / 81 frozen public API counterparts.\n- [x] Reach 100% executable statement coverage and 100% branch coverage.\n- [x] Kill all 3 mutation-smoke mutants.\n- [x] Pass 292 tests locally and in the quality branch.\n- [x] Pass Linux/macOS/Windows CI across Python 3.11–3.14.\n- [x] Pass Ruff lint/format, mypy, frozen API/signature/R-block gates, strict docs, wheel build, and fresh-wheel smoke.\n- [ ] Create and publish exact `v0.1.2` GitHub Release artifacts only after the release PR is green.\n- [ ] Publish those exact GitHub Release artifacts to PyPI through Trusted Publishing.\n- [ ] Verify PyPI hashes and a fresh `pip install gp3sequencespy==0.1.2`.\n\n"""
          if section not in text:
              text = text.replace(future, section + future)
          checklist.write_text(text, encoding="utf-8")

          publishing = Path("PYPI_PUBLISHING.md")
          text = publishing.read_text(encoding="utf-8")
          text = text.replace(
              "The Trusted Publisher was registered on 2026-08-30. After 0.1.1 confirms the\nOIDC path end-to-end, any API token created solely for `gp3sequencespy` can\nbe revoked from PyPI.",
              "The Trusted Publisher was registered on 2026-08-30. Version 0.1.1 subsequently\nconfirmed the OIDC path end-to-end: the `Publish to PyPI` release workflow\ncompleted successfully using the exact GitHub Release wheel and source\ndistribution. Any API token created solely for `gp3sequencespy` is therefore\nno longer required by the automated release path."
          )
          publishing.write_text(text, encoding="utf-8")

          test = Path("tests/test_release_contract.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace('assert project["version"] == g.__version__ == "0.1.1"', 'assert project["version"] == g.__version__ == "0.1.2"')
          text = text.replace('assert "version: 0.1.1" in citation', 'assert "version: 0.1.2" in citation')
          text = text.replace('assert "## [0.1.1] - 2026-08-30" in changelog', 'assert "## [0.1.2] - 2026-08-31" in changelog')
          test.write_text(text, encoding="utf-8")
          PY

          uv lock

      - name: Remove one-shot workflow and commit preparation
        shell: bash
        run: |
          git rm .github/workflows/temp-release-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gp3sequencespy/__init__.py CITATION.cff CHANGELOG.md README.md docs/index.md docs/release-readiness.md RELEASE_CHECKLIST.md PYPI_PUBLISHING.md tests/test_release_contract.py uv.lock
          git commit -m "release: prepare gp3sequencespy 0.1.2 metadata"
          git push origin HEAD:release/0.1.2
