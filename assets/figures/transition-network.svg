<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Illustrative transition network</title>
<desc id="d">Directed weighted transition network among four categorical states.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#667085"/></marker></defs>
<rect width="760" height="430" rx="24" fill="#fff"/>
<text x="38" y="38" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Transition network</text>
<text x="38" y="58" font-family="Inter,Arial,sans-serif" font-size="12" fill="#667085">Directed first-order movement between states</text>
<line x1="200.5" y1="210.9" x2="294.4" y2="152.3" stroke="#667085" stroke-width="3.8" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="362.0" y1="146.5" x2="457.7" y2="195.8" stroke="#667085" stroke-width="5.1" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="465.0" y1="235.0" x2="364.9" y2="301.7" stroke="#667085" stroke-width="4.2" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="299.0" y1="306.6" x2="206.1" y2="251.4" stroke="#667085" stroke-width="3.3" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="330.0" y1="166.0" x2="330.0" y2="283.0" stroke="#667085" stroke-width="2.9" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="463.0" y1="198.5" x2="367.3" y2="149.2" stroke="#667085" stroke-width="2.4" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<line x1="206.0" y1="228.3" x2="453.0" y2="216.9" stroke="#667085" stroke-width="2.4" stroke-linecap="round" opacity=".62" marker-end="url(#arrow)"/>
<circle cx="170" cy="230" r="36" fill="#6750A4" stroke="#fff" stroke-width="6"/>
<text x="170" y="237" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">A</text>
<text x="170" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#667085">State A</text>
<circle cx="330" cy="130" r="36" fill="#3F66D4" stroke="#fff" stroke-width="6"/>
<text x="330" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">B</text>
<text x="330" y="186" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#667085">State B</text>
<circle cx="495" cy="215" r="36" fill="#00A6A6" stroke="#fff" stroke-width="6"/>
<text x="495" y="222" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">C</text>
<text x="495" y="271" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#667085">State C</text>
<circle cx="330" cy="325" r="36" fill="#F59E0B" stroke="#fff" stroke-width="6"/>
<text x="330" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">D</text>
<text x="330" y="381" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#667085">State D</text>
<text x="595" y="315" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98A2B3">Edge width ∝ transition weight</text>
</svg>